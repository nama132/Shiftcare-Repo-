<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ShiftCare Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"/>
  <style>
    body { display: flex; min-height: 100vh; }
    body::before { display: none; }  /* no landing glow behind admin */

    .sidebar {
      width: 232px; flex-shrink: 0;
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 26px 0;
      position: sticky; top: 0; height: 100vh;
    }
    .sidebar .brand {
      font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em;
      padding: 0 24px 22px; border-bottom: 1px solid var(--border);
    }
    .sidebar .brand .dot { color: var(--indigo-2); }
    .sidebar nav { flex: 1; padding-top: 14px; overflow-y: auto; }
    .sidebar nav a {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 24px; margin: 2px 10px;
      border-radius: var(--radius-sm);
      color: var(--text-dim); font-size: 0.9rem; font-weight: 500;
      transition: background .15s, color .15s, transform .15s;
    }
    .sidebar nav a:hover { background: var(--surface-2); color: var(--text); transform: translateX(2px); }
    .sidebar nav a.active {
      background: linear-gradient(90deg, rgba(22,163,74,0.14), rgba(13,148,136,0.08));
      color: var(--indigo-2);
      border: 1px solid rgba(22,163,74,0.25);
    }
    .sidebar .logout { padding: 16px 24px 0; border-top: 1px solid var(--border); }
    .sidebar .logout a { color: #b91c1c; font-size: 0.85rem; transition: color .15s; }
    .sidebar .logout a:hover { color: var(--red); }

    .main { flex: 1; padding: 34px 38px; overflow-y: auto; position: relative; z-index: 1; }
    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 26px;
    }
    .page-header h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; }

    /* legacy admin class aliases mapped onto the design system */
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .card { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      padding: 13px 16px; text-align: left; font-weight: 600; font-size: 0.72rem;
      color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border-2); background: var(--surface-2);
    }
    td { padding: 13px 16px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .15s; }
    tbody tr:hover td { background: var(--surface-2); }

    .form-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 30px; max-width: 580px;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--text-dim); margin-bottom: 7px;
    }
    input[type=text], input[type=date], input[type=time], input[type=tel],
    input[type=email], input[type=password], select, textarea {
      width: 100%; padding: 10px 13px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: var(--font); font-size: 0.9rem;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(22,163,74,0.18);
    }
    select option { background: var(--bg-2); color: var(--text); }
    .form-check { display: flex; align-items: center; gap: 10px; }
    .form-check input { width: auto; }

    .date-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .date-nav a { color: var(--indigo-2); font-size: 0.9rem; transition: color .15s; }
    .date-nav a:hover { color: var(--text); }
    .date-nav strong { font-size: 1rem; }

    @media (max-width: 860px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; padding: 12px; overflow-x: auto; }
      .sidebar .brand { border: none; padding: 0 16px; white-space: nowrap; }
      .sidebar nav { display: flex; padding: 0; }
      .sidebar nav a { white-space: nowrap; margin: 0 2px; padding: 8px 12px; }
      .sidebar .logout { border: none; padding: 0 12px; }
      .main { padding: 20px; }
    }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">🏥 ShiftCare<span class="dot">.</span></div>
  <nav>
    <a href="{{ url_for('admin_caregivers') }}"
       class="{{ 'active' if request.endpoint and 'caregiver' in request.endpoint }}">
      👤 Caregivers
    </a>
    <a href="{{ url_for('admin_clients') }}"
       class="{{ 'active' if request.endpoint and 'client' in request.endpoint }}">
      🧓 Clients
    </a>
    <a href="{{ url_for('admin_shifts') }}"
       class="{{ 'active' if request.endpoint and 'shift' in request.endpoint }}">
      📅 Shifts
    </a>
    <a href="{{ url_for('admin_coverage_log') }}"
       class="{{ 'active' if request.endpoint == 'admin_coverage_log' }}">
      📋 Coverage Log
    </a>
    <a href="{{ url_for('admin_messages') }}"
       class="{{ 'active' if request.endpoint == 'admin_messages' }}">
      💬 Messages
    </a>
    <a href="{{ url_for('admin_contacts') }}"
       class="{{ 'active' if request.endpoint == 'admin_contacts' }}">
      ✉️ Inquiries
    </a>
    <a href="{{ url_for('admin_ratings') }}"
       class="{{ 'active' if request.endpoint == 'admin_ratings' }}">
      ⭐ Ratings
    </a>
    <a href="{{ url_for('admin_scheduler') }}"
       class="{{ 'active' if request.endpoint == 'admin_scheduler' }}">
      🤖 Scheduler
    </a>
    <a href="{{ url_for('dashboard') }}">📊 Live Dashboard</a>
  </nav>
  <div class="logout"><a href="{{ url_for('admin_logout') }}">⬅ Logout</a></div>
</aside>
<main class="main">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
