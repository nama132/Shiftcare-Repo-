{% extends "employee/base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}

<div class="card">
  <div class="card-body">
    {% if error %}
    <div class="flash-error">❌ {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('employee_change_password') }}">
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:13px;font-weight:500;color:#4B6357;margin-bottom:6px;">Current Password</label>
        <input type="password" name="current_password" required
               style="width:100%;padding:12px 14px;border:1.5px solid #C7DDD0;border-radius:10px;font-size:15px;"/>
      </div>
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:13px;font-weight:500;color:#4B6357;margin-bottom:6px;">New Password</label>
        <input type="password" name="new_password" required minlength="8"
               style="width:100%;padding:12px 14px;border:1.5px solid #C7DDD0;border-radius:10px;font-size:15px;"/>
        <div style="font-size:12px;color:#7B9488;margin-top:4px;">Minimum 8 characters</div>
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:13px;font-weight:500;color:#4B6357;margin-bottom:6px;">Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="8"
               style="width:100%;padding:12px 14px;border:1.5px solid #C7DDD0;border-radius:10px;font-size:15px;"/>
      </div>
      <button class="btn btn-blue" type="submit">Save New Password</button>
    </form>
  </div>
</div>

<div style="margin-top:12px;">
  <a href="{{ url_for('employee_profile') }}" class="btn btn-ghost">← Back to Profile</a>
</div>

{% endblock %}
